<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aplicación profesional para gestionar tus tareas diarias">
    <meta name="theme-color" content="#4F46E5">
    <title>Gestor de Tareas - Organiza tu día</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <!-- Pantalla de Login/Registro -->
    <div id="auth-screen" class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Gestor de Tareas</h1>
                <p>Organiza tu día de forma eficiente</p>
            </div>

            <div class="auth-tabs">
                <button id="login-tab" class="auth-tab active">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M13.8 12H3"/>
                    </svg>
                    Iniciar Sesión
                </button>
                <button id="register-tab" class="auth-tab">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                        <circle cx="8.5" cy="7" r="4"/>
                        <line x1="20" y1="8" x2="20" y2="14"/>
                        <line x1="23" y1="11" x2="17" y2="11"/>
                    </svg>
                    Registro
                </button>
            </div>

            <div class="auth-form">
                <div class="form-group">
                    <label for="auth-email">Email</label>
                    <input type="email" id="auth-email" placeholder="tu@email.com" required>
                </div>
                <div class="form-group">
                    <label for="auth-password">Contraseña</label>
                    <input type="password" id="auth-password" placeholder="••••••••" required>
                </div>
                <div id="auth-error" class="error-message hidden"></div>
                <button id="auth-submit" class="btn btn-primary">Iniciar Sesión</button>
            </div>
        </div>
    </div>

    <!-- Pantalla Principal -->
    <div id="main-screen" class="hidden">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1>Mis Tareas</h1>
                <div class="header-actions">
                    <span id="user-email" class="user-email"></span>
                    <button id="logout-btn" class="btn btn-secondary">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
                        </svg>
                        Salir
                    </button>
                </div>
            </div>
        </header>

        <!-- Contenido Principal -->
        <main class="main-content">
            <div id="main-error" class="error-message hidden"></div>

            <div class="toolbar">
                <div class="date-selector">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                        <line x1="16" y1="2" x2="16" y2="6"/>
                        <line x1="8" y1="2" x2="8" y2="6"/>
                        <line x1="3" y1="10" x2="21" y2="10"/>
                    </svg>
                    <input type="date" id="date-selector" class="date-input">
                </div>
                <button id="add-task-btn" class="btn btn-primary">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    Nueva Tarea
                </button>
            </div>

            <div id="tasks-container" class="tasks-container">
                <div class="empty-state">
                    <p>No hay tareas para este día</p>
                    <small>Añade una nueva tarea para comenzar</small>
                </div>
            </div>

            <div id="loading" class="loading hidden">
                <div class="spinner"></div>
                <p>Cargando tareas...</p>
            </div>
        </main>
    </div>

    <!-- Modal para añadir tarea -->
    <div id="task-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Nueva Tarea</h2>
                <button id="close-modal" class="close-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="task-title">Título *</label>
                    <input type="text" id="task-title" placeholder="Ej: Reunión con el equipo" required>
                </div>
                <div class="form-group">
                    <label for="task-description">Descripción</label>
                    <textarea id="task-description" rows="3" placeholder="Detalles adicionales sobre la tarea..."></textarea>
                </div>
                <div class="form-group">
                    <label for="task-importance">Importancia *</label>
                    <select id="task-importance">
                        <option value="Importante">Importante</option>
                        <option value="Medio" selected>Medio</option>
                        <option value="Nada">Nada</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="task-date">Fecha</label>
                    <input type="date" id="task-date">
                </div>
                <div id="modal-error" class="error-message hidden"></div>
                <div class="modal-actions">
                    <button id="add-single-task" class="btn btn-primary">Añadir Tarea</button>
                    <button id="add-week-tasks" class="btn btn-success">Añadir para 7 días</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/tasks.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
